<script>

/////////////////////////////////////////////////
// STATE
/////////////////////////////////////////////////

let audioCtx = null;
let animFrame = 0;
let playing = false;
let animationId = null;

function getStats(){
    return {
        r: Number(localStorage.getItem("r") || 0),
    };
}

function saveStats(s){
    localStorage.setItem("r", s.r);
}

function render(){
    const s = getStats();
    document.getElementById("r").innerText = s.r;
}

/////////////////////////////////////////////////
// SOUND (Chord + rhythm)
/////////////////////////////////////////////////

function playChord(){
    if(!audioCtx){
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }

    const now = audioCtx.currentTime;
    const chords = [
        [261.63, 329.63, 392.00], // C
        [196.00, 246.94, 392.00], // G
        [220.00, 261.63, 329.63], // Am
    ];

    const chord = chords[Math.floor(Math.random() * chords.length)];
    const patterns = [
        [0, 0.10, 0.20, 0.30],
        [0, 0.07, 0.16, 0.26],
        [0, 0.05, 0.18, 0.32],
    ];

    const pattern = patterns[Math.floor(Math.random() * patterns.length)];

    chord.forEach((freq, i) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.type = "triangle";
        osc.frequency.value = freq;

        const t = now + pattern[i];

        gain.gain.setValueAtTime(0.0001, t);
        gain.gain.exponentialRampToValueAtTime(0.25, t + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.6);

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start(t);
        osc.stop(t + 0.7);
    });
}

/////////////////////////////////////////////////
// RUN (SVG Animation)
/////////////////////////////////////////////////

function run(){
    const s = getStats();
    s.r++;
    saveStats(s);
    render();

    playing = true;
    animFrame = 0;

    document.getElementById("output").innerText = "playing... 🎸";
    document.getElementById("guitarWrapper").classList.add("playing");

    playChord();

    // 原生 SVG 琴弦動畫（透過控制 Y2 座標模擬微幅震動）
    const s1 = document.getElementById("s1");
    const s2 = document.getElementById("s2");
    const s3 = document.getElementById("s3");
    const s4 = document.getElementById("s4");
    const s5 = document.getElementById("s5");
    const s6 = document.getElementById("s6");

    function animate(){
        animFrame++;

        if(animFrame < 60){
            // 彈奏時讓琴弦產生正弦波上下晃動
            const offset = Math.sin(animFrame * 0.8) * 2 * (1 - animFrame/60);
            s1.setAttribute("y2", 163 + offset);
            s2.setAttribute("y2", 167 - offset);
            s3.setAttribute("y2", 172 + offset * 1.2);
            s4.setAttribute("y2", 178 - offset * 1.2);
            s5.setAttribute("y2", 183 + offset);
            s6.setAttribute("y2", 187 - offset);

            animationId = requestAnimationFrame(animate);
        } else {
            playing = false;
            // 恢復原狀
            s1.setAttribute("y2", 163);
            s2.setAttribute("y2", 167);
            s3.setAttribute("y2", 172);
            s4.setAttribute("y2", 178);
            s5.setAttribute("y2", 183);
            s6.setAttribute("y2", 187);
            
            document.getElementById("guitarWrapper").classList.remove("playing");
            document.getElementById("output").innerText = "done.";
        }
    }

    if(animationId) cancelAnimationFrame(animationId);
    animate();
}

/////////////////////////////////////////////////
// INIT
/////////////////////////////////////////////////

window.addEventListener("DOMContentLoaded", () => {
    setTimeout(()=>{
        document.getElementById("introScreen").style.opacity = "0";
        setTimeout(()=>document.getElementById("introScreen").remove(),500);
    },1000);

    render();
});

</script>
