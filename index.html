<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>20260623 — gift</title>

<style>
body {
    margin:0;
    background:#0b0b0b;
    color:#fff;
    font-family: monospace;
    text-align:center;
    padding:30px;
}

pre {
    background:#1c1c1c;
    padding:15px;
    text-align:left;
    overflow-x:auto;
    border-radius:8px;
    white-space:pre;
}

button {
    padding:10px 20px;
    margin:10px;
    cursor:pointer;
}

#output {
    margin-top:20px;
    min-height:120px;
    text-align:left;
}

#stage {
    margin-top:25px;
    display:flex;
    justify-content:center;
}

canvas {
    background:#111;
    border-radius:12px;
    width:100%;
    max-width:420px;
    aspect-ratio: 3 / 4;
    border:1px solid #333;
}

.stats {
    margin-top:20px;
    color:#ccc;
}

#introScreen {
    transition: opacity 0.5s ease;
}
</style>
</head>

<body>

<div id="introScreen" style="
position:fixed;
top:0;left:0;
width:100%;height:100%;
background:#0b0b0b;
color:white;
display:flex;
align-items:center;
justify-content:center;
flex-direction:column;
z-index:9999;
font-family:monospace;
">
<div>INITIALIZING...</div>
<div style="margin-top:10px;color:#aaa;">loading gift system</div>
</div>

<h2>🎁 20260623 — gift</h2>

<pre>
#include <stdio.h>

int main() {
    printf("music starts...\n");
    return 0;
}
</pre>

<button onclick="run()">실행 🎸</button>

<div id="output"></div>

<div id="stage">
    <canvas id="art"></canvas>
</div>

<hr>

<div class="stats">
<p>Runs: <span id="r">0</span></p>
</div>

<script>

/////////////////////////////////////////////////
// STATE
/////////////////////////////////////////////////

let audioCtx = null;
let animFrame = 0;
let playing = false;

function getStats(){
    return {
        r: Number(localStorage.getItem("r") || 0),
    };
}

function saveStats(s){
    localStorage.setItem("r", s.r);
}

function render(){
    const s = getStats();
    document.getElementById("r").innerText = s.r;
}

/////////////////////////////////////////////////
// GUITAR (better shape)
/////////////////////////////////////////////////

function drawGuitar(ctx, w, h) {

    ctx.strokeStyle = "#fff";
    ctx.lineWidth = 3;

    // neck
    ctx.beginPath();
    ctx.moveTo(w * 0.52, h * 0.05);
    ctx.lineTo(w * 0.55, h * 0.55);
    ctx.stroke();

    // head
    ctx.fillStyle = "#fff";
    ctx.fillRect(w * 0.495, h * 0.02, w * 0.07, h * 0.05);

    // body (real guitar silhouette)
    ctx.beginPath();
    ctx.moveTo(w * 0.50, h * 0.55);

    ctx.bezierCurveTo(w * 0.28, h * 0.60, w * 0.28, h * 0.72, w * 0.48, h * 0.72);
    ctx.bezierCurveTo(w * 0.28, h * 0.82, w * 0.38, h * 0.92, w * 0.50, h * 0.86);
    ctx.bezierCurveTo(w * 0.62, h * 0.92, w * 0.72, h * 0.82, w * 0.52, h * 0.72);
    ctx.bezierCurveTo(w * 0.72, h * 0.72, w * 0.72, h * 0.60, w * 0.50, h * 0.55);

    ctx.closePath();
    ctx.stroke();

    // sound hole
    ctx.beginPath();
    ctx.arc(w * 0.5, h * 0.73, w * 0.05, 0, Math.PI * 2);
    ctx.stroke();

    // strings (animated)
    const baseY = h * 0.58;

    for(let i=0;i<5;i++){

        const offset = playing ? Math.sin(animFrame * 0.3 + i) * 4 : 0;

        ctx.beginPath();
        ctx.moveTo(w * 0.48, baseY + i * 8);
        ctx.lineTo(w * 0.58, h * 0.12 + i * 8 + offset);
        ctx.stroke();
    }

    if(playing){
        ctx.fillStyle = "rgba(255,255,255,0.05)";
        ctx.beginPath();
        ctx.arc(w*0.5, h*0.73, w*0.25, 0, Math.PI*2);
        ctx.fill();
    }
}

/////////////////////////////////////////////////
// SOUND (Chord + rhythm)
/////////////////////////////////////////////////

function playChord(){

    if(!audioCtx){
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }

    const now = audioCtx.currentTime;

    const chords = [
        [261.63, 329.63, 392.00], // C
        [196.00, 246.94, 392.00], // G
        [220.00, 261.63, 329.63], // Am
    ];

    const chord = chords[Math.floor(Math.random() * chords.length)];

    const patterns = [
        [0, 0.10, 0.20, 0.30],
        [0, 0.07, 0.16, 0.26],
        [0, 0.05, 0.18, 0.32],
    ];

    const pattern = patterns[Math.floor(Math.random() * patterns.length)];

    chord.forEach((freq, i) => {

        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.type = "triangle";
        osc.frequency.value = freq;

        const t = now + pattern[i];

        gain.gain.setValueAtTime(0.0001, t);
        gain.gain.exponentialRampToValueAtTime(0.25, t + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.6);

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start(t);
        osc.stop(t + 0.7);
    });
}

/////////////////////////////////////////////////
// RUN
/////////////////////////////////////////////////

function run(){

    const s = getStats();
    s.r++;
    saveStats(s);
    render();

    const canvas = document.getElementById("art");
    const ctx = canvas.getContext("2d");

    const w = Math.min(window.innerWidth * 0.8, 420);
    const h = w * 1.3;

    canvas.width = w;
    canvas.height = h;

    playing = true;
    animFrame = 0;

    document.getElementById("output").innerText = "playing... 🎸";

    playChord();

    function animate(){

        ctx.clearRect(0,0,w,h);

        drawGuitar(ctx, w, h);

        animFrame++;

        if(animFrame < 60){
            requestAnimationFrame(animate);
        } else {
            playing = false;
            document.getElementById("output").innerText = "done.";
        }
    }

    animate();
}

/////////////////////////////////////////////////
// INIT
/////////////////////////////////////////////////

window.addEventListener("DOMContentLoaded", () => {

    setTimeout(()=>{
        document.getElementById("introScreen").style.opacity = "0";
        setTimeout(()=>document.getElementById("introScreen").remove(),500);
    },1000);

    render();
});

</script>

</body>
</html>
