<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>20260623 — gift</title>

<style>
body {
    background:#0b0b0b;
    color:#fff;
    font-family: monospace;
    text-align:center;
    padding:30px;
}

pre {
    background:#1c1c1c;
    padding:15px;
    text-align:left;
    overflow-x:auto;
    border-radius:8px;
    white-space:pre;
}

button {
    padding:10px 20px;
    margin:10px;
    cursor:pointer;
}

#output {
    margin-top:20px;
    min-height:200px;
    text-align:left;
    white-space:pre;
}

.small { color:#aaa; }

.stats {
    margin-top:20px;
    color:#ccc;
}

#introScreen {
    transition: opacity 0.5s ease;
}
</style>
</head>

<body>

<div id="introScreen" style="
position:fixed;
top:0;left:0;
width:100%;height:100%;
background:#0b0b0b;
color:white;
display:flex;
align-items:center;
justify-content:center;
flex-direction:column;
z-index:9999;
font-family:monospace;
">
<div>INITIALIZING...</div>
<div style="margin-top:10px;color:#aaa;">loading gift system</div>
</div>

<h2>🎁 20260623</h2>
<p class="small">ASCII instrument generator</p>

<pre>
#include <stdio.h>

int main() {
    printf("Loading...\n");
    printf("Run program...\n");
    return 0;
}
</pre>

<button onclick="run()">실행</button>
<button onclick="copy()">복사</button>

<div id="output"></div>

<hr>

<div class="stats">
<p>Views: <span id="v">0</span></p>
<p>Runs: <span id="r">0</span></p>
<p>Copies: <span id="c">0</span></p>
</div>

<script>

/////////////////////////////////////////////////
// STATS
/////////////////////////////////////////////////

function getStats(){
    return {
        v: Number(localStorage.getItem("v") || 0),
        r: Number(localStorage.getItem("r") || 0),
        c: Number(localStorage.getItem("c") || 0),
    };
}

function saveStats(s){
    localStorage.setItem("v", s.v);
    localStorage.setItem("r", s.r);
    localStorage.setItem("c", s.c);
}

function render(){
    const s = getStats();
    document.getElementById("v").innerText = s.v;
    document.getElementById("r").innerText = s.r;
    document.getElementById("c").innerText = s.c;
}

function addView(){
    const s = getStats();
    s.v++;
    saveStats(s);
    render();
}

/////////////////////////////////////////////////
// ASCII ENGINE (responsive)
/////////////////////////////////////////////////

function getWidthScale() {
    return Math.max(30, Math.min(80, Math.floor(window.innerWidth / 12)));
}

function makeGuitar() {
    const w = getWidthScale();
    let out = "";

    out += " ".repeat(w * 0.2) + "🎸 GUITAR\n\n";

    // head
    out += " ".repeat(w * 0.25) + "||====||\n";
    out += " ".repeat(w * 0.25) + "||====||\n";

    // neck
    for (let i = 0; i < 4; i++) {
        out += " ".repeat(w * 0.28) + "||    ||\n";
    }

    // body
    out += " ".repeat(w * 0.2) + "  _________\n";
    out += " ".repeat(w * 0.2) + " /         \\\n";
    out += " ".repeat(w * 0.2) + "/  GUITAR   \\\n";
    out += " ".repeat(w * 0.2) + "\\           /\n";
    out += " ".repeat(w * 0.2) + " \\_________/\n";

    return out;
}

function makeMic() {
    const w = getWidthScale();
    let out = "\n";

    out += " ".repeat(w * 0.3) + "🎤 MICROPHONE\n\n";

    out += " ".repeat(w * 0.35) + " ___ \n";
    out += " ".repeat(w * 0.35) + "|   |\n";
    out += " ".repeat(w * 0.35) + "|   |\n";
    out += " ".repeat(w * 0.35) + "|___|\n";
    out += " ".repeat(w * 0.37) + " | |\n";
    out += " ".repeat(w * 0.37) + " | |\n";
    out += " ".repeat(w * 0.36) + " /   \\\n";
    out += " ".repeat(w * 0.35) + "/_____\\\n";

    return out;
}

/////////////////////////////////////////////////
// RUN
/////////////////////////////////////////////////

function run(){

    const s = getStats();
    s.r++;
    saveStats(s);
    render();

    const out = document.getElementById("output");
    out.innerHTML = "";

    const lines = [
        "compiling...",
        "linking modules...",
        "running program...",
        "",
        "████ SUCCESS ████",
        "",
        "output ready",
    ];

    let i = 0;

    const timer = setInterval(() => {

        if (i >= lines.length) {
            clearInterval(timer);

            out.innerHTML += "<pre>" + makeGuitar() + "</pre>";
            out.innerHTML += "<pre>" + makeMic() + "</pre>";

            return;
        }

        out.innerHTML += lines[i] + "<br>";
        i++;

    }, 120);
}

/////////////////////////////////////////////////
// COPY
/////////////////////////////////////////////////

function copy(){

    const s = getStats();
    s.c++;
    saveStats(s);
    render();

    navigator.clipboard.writeText(
        document.querySelector("pre").innerText
    );

    alert("Copied.");
}

/////////////////////////////////////////////////
// INIT
/////////////////////////////////////////////////

window.addEventListener("DOMContentLoaded", () => {
    setTimeout(() => {
        const el = document.getElementById("introScreen");
        el.style.opacity = "0";
        setTimeout(() => el.remove(), 500);
    }, 1000);

    addView();
    render();
});

</script>

</body>
</html>
