<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<style>
body {
    margin:0;
    background:#0b0b0b;

    margin-top:20px;

<body>

<div id="introScreen" style="
position:fixed;
top:0;left:0;
width:100%;height:100%;
background:#0b0b0b;
color:white;
display:flex;
align-items:center;
justify-content:center;
flex-direction:column;
z-index:9999;
font-family:monospace;
">
<div>INITIALIZING...</div>
<div style="margin-top:10px;color:#aaa;">loading gift system</div>
</div>

<h2>🎁 20260623 — gift</h2>

<pre>
#include <stdio.h>

int main() {
    printf("music starts...\n");
    return 0;
}
</pre>

<button onclick="run()">실행 🎸</button>

<div id="output"></div>

<div id="stage">
    <canvas id="art"></canvas>
</div>

<hr>

<div class="stats">
<p>Runs: <span id="r">0</span></p>
</div>

<script>

/////////////////////////////////////////////////
// STATE
/////////////////////////////////////////////////

let audioCtx = null;
let animFrame = 0;
let playing = false;

function getStats(){
    return {
        r: Number(localStorage.getItem("r") || 0),
    };
}

function saveStats(s){
    localStorage.setItem("r", s.r);
}

function render(){
    const s = getStats();
    document.getElementById("r").innerText = s.r;
}

/////////////////////////////////////////////////
// GUITAR (improved shape)
/////////////////////////////////////////////////

function drawGuitar(ctx, w, h) {

    ctx.strokeStyle = "#fff";
    ctx.fillStyle = "#fff";
    ctx.lineWidth = 1.5; // Slightly finer default lines

    // Scale factors to fit within the canvas nicely
    const scale = w / 420; // Original max-width reference

    // 1. Neck & Headstock
    const neckWidth = 24 * scale;
    const neckX = w * 0.5 - neckWidth/2;
    const neckY = h * 0.10;
    const neckHeight = h * 0.50;

    // Neck outline
    ctx.beginPath();
    ctx.moveTo(neckX, neckY);
    ctx.lineTo(neckX, neckY + neckHeight);
    ctx.moveTo(neckX + neckWidth, neckY);
    ctx.lineTo(neckX + neckWidth, neckY + neckHeight);
    ctx.stroke();

    // Headstock
    const hsWidth = 32 * scale;
    const hsHeight = 45 * scale;
    ctx.fillRect(w * 0.5 - hsWidth/2, neckY - hsHeight, hsWidth, hsHeight);

    // Tuning Pegs (6 dots)
    ctx.lineWidth = 1;
    for (let i=0; i<6; i++) {
        const side = i < 3 ? -1 : 1;
        const row = i % 3;
        const px = w * 0.5 + (side * (hsWidth/2 + 5 * scale));
        const py = neckY - (hsHeight * 0.8) + (row * 12 * scale);
        ctx.beginPath();
        ctx.arc(px, py, 2.5 * scale, 0, Math.PI*2);
        ctx.fillStyle = "#bbb";
        ctx.fill();
        ctx.fillStyle = "#fff"; // Reset
    }

    // 2. Fretboard
    ctx.lineWidth = 1.5;
    const startFret = neckY + (h * 0.05);
    const endFret = neckY + neckHeight - (h * 0.03);
    const numFrets = 15;
    for (let i=0; i<numFrets; i++) {
        const fretY = startFret + (endFret - startFret) * (i / (numFrets - 1));
        ctx.beginPath();
        ctx.moveTo(neckX, fretY);
        ctx.lineTo(neckX + neckWidth, fretY);
        ctx.stroke();
    }

    // Fret markers (optional dots)
    const markerYPos = [3, 5, 7, 9, 12, 12.05].map(f => startFret + (endFret-startFret) * (f/(numFrets-1)));
    ctx.fillStyle = "#ddd";
    markerYPos.forEach(y => {
        ctx.beginPath();
        ctx.arc(w*0.5, y - 10*scale, 2*scale, 0, Math.PI*2);
        ctx.fill();
    });
    ctx.fillStyle = "#fff"; // Reset

    // 3. Body (Refined figure-8 shape)
    const bodyCenterY = h * 0.76;
    const upperY = bodyCenterY - (h*0.13);
    const lowerY = bodyCenterY + (h*0.04);
    
    ctx.beginPath();
    // Start top-left
    ctx.moveTo(w*0.5, upperY); 

    // Draw left side
    ctx.bezierCurveTo(w*0.28, upperY, w*0.20, bodyCenterY*0.95, w*0.38, bodyCenterY); // Upper curve to waist
    ctx.bezierCurveTo(w*0.24, bodyCenterY*1.05, w*0.20, lowerY*1.05, w*0.5, lowerY); // Waist to lower curve
    
    // Draw right side (symmetry)
    ctx.bezierCurveTo(w*0.80, lowerY*1.05, w*0.76, bodyCenterY*1.05, w*0.62, bodyCenterY); // Lower curve to waist
    ctx.bezierCurveTo(w*0.80, bodyCenterY*0.95, w*0.72, upperY, w*0.5, upperY); // Waist to upper curve
    
    ctx.lineWidth = 3; // Thicker for body
    ctx.stroke();
    ctx.lineWidth = 1.5; // Back to normal

    // 4. Sound Hole & Rosette
    const shRadius = 32 * scale;
    const rosetteRadius = 38 * scale;
    const shY = bodyCenterY - (h*0.03);

    // Inner Hole (fill slightly darker or with alpha)
    ctx.beginPath();
    ctx.arc(w*0.5, shY, shRadius, 0, Math.PI*2);
    ctx.fillStyle = "rgba(0,0,0,0.4)";
    ctx.fill();
    ctx.lineWidth = 1;
    ctx.stroke();

    // Outer Rosette (lines)
    ctx.beginPath();
    ctx.arc(w*0.5, shY, rosetteRadius, 0, Math.PI*2);
    ctx.stroke();
    ctx.lineWidth = 1.5; // Back to normal
    ctx.fillStyle = "#fff"; // Reset

    // 5. Bridge
    const bridgeY = bodyCenterY + (h * 0.12);
    const bridgeWidth = 60 * scale;
    const bridgeHeight = 12 * scale;
    ctx.fillRect(w * 0.5 - bridgeWidth/2, bridgeY, bridgeWidth, bridgeHeight);

    // Bridge dots/pins
    for(let i=0; i<6; i++) {
        const px = w*0.5 - (bridgeWidth/2) + (i*10 + 5) * scale;
        ctx.beginPath();
        ctx.arc(px, bridgeY + bridgeHeight/2, 2*scale, 0, Math.PI*2);
        ctx.fillStyle = "#ddd";
        ctx.fill();
    }
    ctx.fillStyle = "#fff"; // Reset

    // 6. Strings (6 proper strings)
    ctx.lineWidth = 0.8;
    for(let i=0; i<6; i++) {
        const offset = playing ? Math.sin(animFrame*0.3 + i)*2 : 0;
        
        // String attachment point on neck/headstock (approximate)
        const neckStrX = neckX + (neckWidth / 12) + (i * (neckWidth / 6.5));
        
        // String attachment point on bridge
        const bridgeStrX = w*0.5 - (bridgeWidth/2) + (i*10 + 5) * scale;

        ctx.beginPath();
        // Adjust start point relative to neck width for realism
        ctx.moveTo(neckStrX, neckY - (hsHeight * 0.3)); 
        // Curve slightly if playing
        ctx.lineTo(bridgeStrX + offset, bridgeY); 
        ctx.stroke();
    }

    // ===== vibration glow (subtle and matching shape) =====
    if(playing){
        ctx.fillStyle = "rgba(255,255,255,0.03)";
        ctx.beginPath();
        // Draw the same figure-8 path, slightly enlarged
        const vScale = 1.05;
        ctx.scale(vScale,vScale);
        ctx.translate((w/2)*(1-1/vScale), (h/2)*(1-1/vScale));

        ctx.moveTo(w*0.5, upperY); 
        ctx.bezierCurveTo(w*0.28, upperY, w*0.20, bodyCenterY*0.95, w*0.38, bodyCenterY);
        ctx.bezierCurveTo(w*0.24, bodyCenterY*1.05, w*0.20, lowerY*1.05, w*0.5, lowerY);
        ctx.bezierCurveTo(w*0.80, lowerY*1.05, w*0.76, bodyCenterY*1.05, w*0.62, bodyCenterY);
        ctx.bezierCurveTo(w*0.80, bodyCenterY*0.95, w*0.72, upperY, w*0.5, upperY);
        
        ctx.fill();
        ctx.setTransform(1, 0, 0, 1, 0, 0); // Reset scale/translation
    }
}

/////////////////////////////////////////////////
// SOUND (Chord + rhythm)
/////////////////////////////////////////////////

function playChord(){

    if(!audioCtx){
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }

    const now = audioCtx.currentTime;

    const chords = [
        [261.63, 329.63, 392.00], // C
        [196.00, 246.94, 392.00], // G
        [220.00, 261.63, 329.63], // Am
    ];

    const chord = chords[Math.floor(Math.random() * chords.length)];

    const patterns = [
        [0, 0.10, 0.20, 0.30],
        [0, 0.07, 0.16, 0.26],
        [0, 0.05, 0.18, 0.32],
    ];

    const pattern = patterns[Math.floor(Math.random() * patterns.length)];

    chord.forEach((freq, i) => {

        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.type = "triangle";
        osc.frequency.value = freq;

        const t = now + pattern[i];

        gain.gain.setValueAtTime(0.0001, t);
        gain.gain.exponentialRampToValueAtTime(0.25, t + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.6);

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start(t);
        osc.stop(t + 0.7);
    });
}

/////////////////////////////////////////////////
// RUN
/////////////////////////////////////////////////

function run(){

    const s = getStats();
    s.r++;
    saveStats(s);
    render();

    const canvas = document.getElementById("art");
    const ctx = canvas.getContext("2d");

    const w = Math.min(window.innerWidth * 0.8, 420);
    const h = w * 1.3;

    canvas.width = w;
    canvas.height = h;

    playing = true;
    animFrame = 0;

    document.getElementById("output").innerText = "playing... 🎸";

    playChord();

    function animate(){

        ctx.clearRect(0,0,w,h);

        drawGuitar(ctx, w, h);

        animFrame++;

        if(animFrame < 60){
            requestAnimationFrame(animate);
        } else {
            playing = false;
            document.getElementById("output").innerText = "done.";
        }
    }

    animate();
}

/////////////////////////////////////////////////
// INIT
/////////////////////////////////////////////////

window.addEventListener("DOMContentLoaded", () => {

    setTimeout(()=>{
        document.getElementById("introScreen").style.opacity = "0";
        setTimeout(()=>document.getElementById("introScreen").remove(),500);
    },1000);

    render();
});

</script>

</body>
</html>
