<script>

let audioCtx = null;

function play(){

    const card = document.querySelector(".card");

    // ===== visual animation =====
    card.classList.add("playing");

    setTimeout(() => {
        card.classList.remove("playing");
    }, 700);

    // ===== sound (Web Audio API) =====
    playPluckSound();
}

function playPluckSound(){

    // 初始化 audio context（第一次點擊才建立）
    if(!audioCtx){
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }

    const now = audioCtx.currentTime;

    // 做 3~5 個「撥弦音」
    for(let i=0;i<4;i++){

        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.type = "triangle";

        // 模擬不同弦音（頻率）
        osc.frequency.value = 220 + i * 60;

        // 音量包絡（很重要，不然會刺耳）
        gain.gain.setValueAtTime(0.0001, now + i*0.03);
        gain.gain.exponentialRampToValueAtTime(0.2, now + i*0.03 + 0.01);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + i*0.03 + 0.4);

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start(now + i*0.03);
        osc.stop(now + i*0.03 + 0.5);
    }
}

</script>
