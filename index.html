<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>20260623 — gift</title>
<canvas id="art"></canvas>
<style>
body {
    background:#0b0b0b;
    color:#fff;
    font-family: monospace;
    text-align:center;
    padding:30px;
}

pre {
    background:#1c1c1c;
    padding:15px;
    text-align:left;
    overflow-x:auto;
    border-radius:8px;
    white-space:pre;
}

button {
    padding:10px 20px;
    margin:10px;
    cursor:pointer;
}

#output {
    margin-top:20px;
    min-height:200px;
    text-align:left;
    white-space:pre;
}

.small { color:#aaa; }

.stats {
    margin-top:20px;
    color:#ccc;
}

#introScreen {
    transition: opacity 0.5s ease;
}
    canvas {
    margin-top:20px;
    background:#111;
    border-radius:10px;
    width:100%;
    max-width:700px;
    height:auto;
}
</style>
</head>

<body>

<div id="introScreen" style="
position:fixed;
top:0;left:0;
width:100%;height:100%;
background:#0b0b0b;
color:white;
display:flex;
align-items:center;
justify-content:center;
flex-direction:column;
z-index:9999;
font-family:monospace;
">
<div>INITIALIZING...</div>
<div style="margin-top:10px;color:#aaa;">loading gift system</div>
</div>

<h2>🎁 20260623</h2>
<p class="small">ASCII instrument generator</p>

<pre>
#include <stdio.h>

int main() {
    printf("Loading...\n");
    printf("Run program...\n");
    return 0;
}
</pre>

<button onclick="run()">실행</button>
<button onclick="copy()">복사</button>

<div id="output"></div>

<hr>

<div class="stats">
<p>Views: <span id="v">0</span></p>
<p>Runs: <span id="r">0</span></p>
<p>Copies: <span id="c">0</span></p>
</div>

<script>

/////////////////////////////////////////////////
// STATS
/////////////////////////////////////////////////

function getStats(){
    return {
        v: Number(localStorage.getItem("v") || 0),
        r: Number(localStorage.getItem("r") || 0),
        c: Number(localStorage.getItem("c") || 0),
    };
}

function saveStats(s){
    localStorage.setItem("v", s.v);
    localStorage.setItem("r", s.r);
    localStorage.setItem("c", s.c);
}

function render(){
    const s = getStats();
    document.getElementById("v").innerText = s.v;
    document.getElementById("r").innerText = s.r;
    document.getElementById("c").innerText = s.c;
}

function addView(){
    const s = getStats();
    s.v++;
    saveStats(s);
    render();
}

/////////////////////////////////////////////////
// ASCII ENGINE (responsive)
/////////////////////////////////////////////////

function getWidthScale() {
    return Math.max(30, Math.min(80, Math.floor(window.innerWidth / 12)));
}

function makeGuitar() {
    const w = getWidthScale();
    let out = "";

    out += " ".repeat(w * 0.2) + "🎸 GUITAR\n\n";

    // head
    out += " ".repeat(w * 0.25) + "||====||\n";
    out += " ".repeat(w * 0.25) + "||====||\n";

    // neck
    for (let i = 0; i < 4; i++) {
        out += " ".repeat(w * 0.28) + "||    ||\n";
    }

    // body
    out += " ".repeat(w * 0.2) + "  _________\n";
    out += " ".repeat(w * 0.2) + " /         \\\n";
    out += " ".repeat(w * 0.2) + "/  GUITAR   \\\n";
    out += " ".repeat(w * 0.2) + "\\           /\n";
    out += " ".repeat(w * 0.2) + " \\_________/\n";

    return out;
}

function makeMic() {
    const w = getWidthScale();
    let out = "\n";

    out += " ".repeat(w * 0.3) + "🎤 MICROPHONE\n\n";

    out += " ".repeat(w * 0.35) + " ___ \n";
    out += " ".repeat(w * 0.35) + "|   |\n";
    out += " ".repeat(w * 0.35) + "|   |\n";
    out += " ".repeat(w * 0.35) + "|___|\n";
    out += " ".repeat(w * 0.37) + " | |\n";
    out += " ".repeat(w * 0.37) + " | |\n";
    out += " ".repeat(w * 0.36) + " /   \\\n";
    out += " ".repeat(w * 0.35) + "/_____\\\n";

    return out;
}

/////////////////////////////////////////////////
// RUN
/////////////////////////////////////////////////

function drawGuitar(ctx, w, h) {

    ctx.strokeStyle = "#fff";
    ctx.lineWidth = 3;

    // neck
    ctx.beginPath();
    ctx.moveTo(w * 0.5, h * 0.1);
    ctx.lineTo(w * 0.5, h * 0.6);
    ctx.stroke();

    // head
    ctx.fillStyle = "#fff";
    ctx.fillRect(w * 0.47, h * 0.05, w * 0.06, h * 0.06);

    // body (simple circle)
    ctx.beginPath();
    ctx.arc(w * 0.5, h * 0.75, w * 0.18, 0, Math.PI * 2);
    ctx.stroke();

    // sound hole
    ctx.beginPath();
    ctx.arc(w * 0.5, h * 0.75, w * 0.06, 0, Math.PI * 2);
    ctx.stroke();
}

function drawMic(ctx, w, h) {

    ctx.strokeStyle = "#fff";
    ctx.lineWidth = 3;

    // head
    ctx.beginPath();
    ctx.arc(w * 0.5, h * 0.2, w * 0.08, 0, Math.PI * 2);
    ctx.stroke();

    // body
    ctx.beginPath();
    ctx.moveTo(w * 0.5, h * 0.28);
    ctx.lineTo(w * 0.5, h * 0.65);
    ctx.stroke();

    // stand
    ctx.beginPath();
    ctx.moveTo(w * 0.5, h * 0.65);
    ctx.lineTo(w * 0.35, h * 0.9);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(w * 0.5, h * 0.65);
    ctx.lineTo(w * 0.65, h * 0.9);
    ctx.stroke();
}

function run() {

    const s = getStats();
    s.r++;
    saveStats(s);
    render();

    const canvas = document.getElementById("art");
    const ctx = canvas.getContext("2d");

    // 自適應尺寸（關鍵）
    const size = Math.min(window.innerWidth * 0.8, 600);
    canvas.width = size;
    canvas.height = size;

    ctx.clearRect(0, 0, size, size);

    const out = document.getElementById("output");
    out.innerHTML = "rendering...";

    setTimeout(() => {

        ctx.clearRect(0, 0, size, size);

        // 上半部：吉他
        drawGuitar(ctx, size, size);

        // 下半部：麥克風
        drawMic(ctx, size, size);

        out.innerHTML = "done.";

    }, 300);
}

/////////////////////////////////////////////////
// COPY
/////////////////////////////////////////////////

function copy(){

    const s = getStats();
    s.c++;
    saveStats(s);
    render();

    navigator.clipboard.writeText(
        document.querySelector("pre").innerText
    );

    alert("Copied.");
}

/////////////////////////////////////////////////
// INIT
/////////////////////////////////////////////////

window.addEventListener("DOMContentLoaded", () => {
    setTimeout(() => {
        const el = document.getElementById("introScreen");
        el.style.opacity = "0";
        setTimeout(() => el.remove(), 500);
    }, 1000);

    addView();
    render();
});

</script>

</body>
</html>
